name: Publish website archive

on:
  push:
    branches: [main]
    paths:
      - hanekom-site-publish.zip

permissions:
  contents: write

jobs:
  unpack-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website
        run: |
          unzip -oq hanekom-site-publish.zip
          rm hanekom-site-publish.zip
          touch .nojekyll
      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Hanekom Innovations website"
          git push
